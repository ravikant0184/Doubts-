<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doubt Focus — search a doubt, watch only that</title>
<style>
  :root{
    --bg:#f4efe2; --paper:#fffdf6; --surface-2:#ece4d1; --ink:#2a271f; --ink-dim:#6d6653; --line:#d8cdb1;
    --accent:#8a3b2b; --accent-ink:#fff8f0; --ok:#3f7a4f; --radius:6px;
  }
  [data-theme="dark"]{
    --bg:#181410; --paper:#221c16; --surface-2:#2b241c; --ink:#f2ece0; --ink-dim:#b0a48e; --line:#3c3226;
    --accent:#d97757; --accent-ink:#20140f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181410; --paper:#221c16; --surface-2:#2b241c; --ink:#f2ece0; --ink-dim:#b0a48e; --line:#3c3226;
      --accent:#d97757; --accent-ink:#20140f;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;border-bottom:1px solid var(--line);}
  .brand{font-size:1.3rem;letter-spacing:.2px;}
  .brand b{color:var(--accent);}
  .theme-btn{font-family:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:var(--radius);cursor:pointer;}

  main{max-width:920px;margin:0 auto;padding:40px 20px 80px;}
  .hero h1{font-size:2rem;line-height:1.3;text-align:center;margin:0 0 10px;font-weight:600;}
  .hero p{text-align:center;color:var(--ink-dim);max-width:520px;margin:0 auto 30px;line-height:1.6;font-size:.95rem;}

  .search-box{display:flex;gap:8px;max-width:640px;margin:0 auto;}
  .search-box input{flex:1;font-family:inherit;font-size:1.05rem;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);}
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-box button{font-family:inherit;font-size:1rem;padding:14px 22px;border:none;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);cursor:pointer;}
  .search-box button:disabled{opacity:.5;cursor:default;}

  .chips{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .chip{font-family:inherit;font-size:.8rem;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink-dim);cursor:pointer;}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  .status{text-align:center;color:var(--ink-dim);margin-top:34px;font-size:.9rem;}

  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 16px;margin-top:34px;}
  .card{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .12s ease;}
  .card:hover{transform:translateY(-2px);}
  .card .thumb{position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-2);}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .thumb .dur{position:absolute;right:5px;bottom:5px;background:#000;color:#fff;font-size:.65rem;padding:2px 5px;border-radius:2px;}
  .card .body{padding:10px 12px 14px;}
  .card .t{font-size:.86rem;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .ch{font-size:.74rem;color:var(--ink-dim);margin-top:6px;}
  .card .d{font-size:.7rem;color:var(--ink-dim);margin-top:2px;}

  /* ---------- Focus player: nothing else on screen while a video plays ---------- */
  .focus{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;}
  .focus.show{display:flex;}
  .focus-top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);}
  .focus-top button{font-family:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85rem;}
  .focus-top .ft{font-size:.9rem;color:var(--ink-dim);}
  .focus-body{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .focus-frame-wrap{width:100%;max-width:1000px;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;}
  .focus-frame-wrap iframe{width:100%;height:100%;border:0;}
  .focus-title{max-width:1000px;width:100%;margin:14px auto 0;font-size:1.05rem;font-weight:600;}
  .focus-meta{max-width:1000px;width:100%;margin:4px auto 0;font-size:.82rem;color:var(--ink-dim);}
</style>
</head>
<body>

<header>
  <div class="brand"><b>Doubt</b> Focus</div>
  <button class="theme-btn" id="themeBtn">Theme</button>
</header>

<main>
  <div class="hero">
    <h1>Ask your doubt. Watch only that.</h1>
    <p>Type any physics, maths or chemistry question — you'll get a clean list of real explanation videos for it. No Shorts, no home feed, no "up next" rabbit hole.</p>
  </div>

  <div class="search-box">
    <input id="q" type="text" placeholder="e.g. integration by parts tricky question, or paste the doubt" autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-s="">Any subject</button>
    <button class="chip" data-s="physics">Physics</button>
    <button class="chip" data-s="maths">Maths</button>
    <button class="chip" data-s="chemistry">Chemistry</button>
  </div>

  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</main>

<div class="focus" id="focus">
  <div class="focus-top">
    <button id="backBtn">← Back to results</button>
    <span class="ft">Playing — everything else is hidden on purpose</span>
  </div>
  <div class="focus-body">
    <div>
      <div class="focus-frame-wrap" id="frameWrap"></div>
      <div class="focus-title" id="focusTitle"></div>
      <div class="focus-meta" id="focusMeta"></div>
    </div>
  </div>
</div>

<script>
const root = document.documentElement;
(function initTheme(){
  const saved = localStorage.getItem("df-theme");
  if(saved) root.setAttribute("data-theme", saved);
})();
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = root.getAttribute("data-theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("df-theme", next);
});

let subject = "";
document.getElementById("chips").addEventListener("click", (e)=>{
  const chip = e.target.closest(".chip");
  if(!chip) return;
  subject = chip.dataset.s;
  [...document.querySelectorAll(".chip")].forEach(c=>c.classList.toggle("on", c===chip));
});
document.querySelector('.chip[data-s=""]').classList.add("on");

const qInput = document.getElementById("q");
const searchBtn = document.getElementById("searchBtn");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

async function runSearch(){
  const q = qInput.value.trim();
  if(!q) return;
  searchBtn.disabled = true;
  statusEl.textContent = "Searching…";
  resultsEl.innerHTML = "";
  try{
    const url = `/api/search-topic?q=${encodeURIComponent(q)}` + (subject ? `&subject=${encodeURIComponent(subject)}` : "");
    const r = await fetch(url);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    if(!data.videos || !data.videos.length){
      statusEl.textContent = "No clean matches found — try rephrasing the doubt.";
      return;
    }
    statusEl.textContent = `${data.videos.length} video${data.videos.length===1?"":"s"} found.`;
    resultsEl.innerHTML = data.videos.map(v => `
      <div class="card" data-play="${v.id}" data-title="${escapeAttr(v.title)}" data-ch="${escapeAttr(v.channelTitle)}">
        <div class="thumb">
          <img src="${v.thumbnail}" loading="lazy" alt="">
          <span class="dur">${formatDuration(v.durationSeconds)}</span>
        </div>
        <div class="body">
          <div class="t">${escapeHtml(v.title)}</div>
          <div class="ch">${escapeHtml(v.channelTitle)}</div>
          <div class="d">${formatViews(v.viewCount)} views · ${formatShortDate(v.publishedAt)}</div>
        </div>
      </div>
    `).join("");
  }catch(err){
    statusEl.textContent = "Search failed: " + err.message;
  }finally{
    searchBtn.disabled = false;
  }
}
searchBtn.addEventListener("click", runSearch);
qInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") runSearch(); });

resultsEl.addEventListener("click", (e)=>{
  const card = e.target.closest("[data-play]");
  if(!card) return;
  openFocus(card.dataset.play, card.dataset.title, card.dataset.ch);
});

const focusEl = document.getElementById("focus");
function openFocus(id, title, channel){
  document.getElementById("frameWrap").innerHTML =
    `<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1"
       allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  document.getElementById("focusTitle").textContent = title;
  document.getElementById("focusMeta").textContent = channel;
  focusEl.classList.add("show");
}
document.getElementById("backBtn").addEventListener("click", ()=>{
  document.getElementById("frameWrap").innerHTML = ""; // stop playback
  focusEl.classList.remove("show");
});

function formatDuration(sec){
  if(!sec) return "";
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  const mm = h ? String(m).padStart(2,'0') : m;
  return (h?h+":":"") + mm + ":" + String(s).padStart(2,'0');
}
function formatShortDate(iso){
  return new Date(iso).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
}
function formatViews(n){
  if(n>=1e7) return (n/1e7).toFixed(1)+"Cr";
  if(n>=1e5) return (n/1e5).toFixed(1)+"L";
  if(n>=1e3) return (n/1e3).toFixed(1)+"K";
  return String(n);
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }
</script>
</body>
</html>
